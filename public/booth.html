<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>RaveCall booth</title>
<script src="https://cdn.jsdelivr.net/npm/livekit-client@2.5.0/dist/livekit-client.umd.js"></script>
<style>body{font:16px/1.5 system-ui,sans-serif;max-width:460px;margin:24px auto;padding:0 16px}
input,select,button{display:block;width:100%;font:inherit;padding:10px;margin:8px 0;box-sizing:border-box}
button{background:#6a43ff;color:#fff;border:0;border-radius:10px;font-weight:700;cursor:pointer}#msg{color:#555}</style></head><body>
<h1>RaveCall booth</h1>
<p>Send the venue&rsquo;s main mix to everyone who joins this event. Choose the audio interface that receives the mixer&rsquo;s output.</p>
<input id="code" placeholder="Event code">
<input id="key" type="password" placeholder="Booth key">
<select id="dev"><option value="">Default audio input</option></select>
<button id="go">Start broadcasting</button>
<p id="msg"></p>
<script>
const $=s=>document.querySelector(s);let room;
navigator.mediaDevices.getUserMedia({audio:true}).then(s=>{s.getTracks().forEach(t=>t.stop());return navigator.mediaDevices.enumerateDevices()}).then(d=>{
 d.filter(x=>x.kind==='audioinput').forEach(x=>{const o=document.createElement('option');o.value=x.deviceId;o.textContent=x.label||'Input';$('#dev').appendChild(o)})}).catch(()=>{});
$('#go').onclick=async()=>{
 const LK=LivekitClient;
 if(room){room.disconnect();room=null;$('#go').textContent='Start broadcasting';$('#msg').textContent='Stopped.';return}
 try{
  const r=await fetch('/token',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:$('#code').value,boothKey:$('#key').value})});
  if(!r.ok)throw new Error(r.status===401?'Wrong event code.':'Server error '+r.status);
  const info=await r.json();
  if(!info.token)throw new Error('No token');
  const st=await navigator.mediaDevices.getUserMedia({audio:{deviceId:$('#dev').value?{exact:$('#dev').value}:undefined,echoCancellation:false,noiseSuppression:false,autoGainControl:false,channelCount:2}});
  room=new LK.Room();await room.connect(info.url,info.token);
  await room.localParticipant.publishTrack(st.getAudioTracks()[0],{source:LK.Track.Source.Microphone,dtx:false,red:false,audioPreset:LK.AudioPresets.musicHighQualityStereo});
  $('#go').textContent='Stop broadcasting';$('#msg').textContent='Live to '+info.event+'. Identity: '+room.localParticipant.identity;
 }catch(e){$('#msg').textContent='Couldn\u2019t start: '+e.message}
};
</script></body></html>
